// build.gradle for external-renderer
// Standalone Java application with LWJGL 2

plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'renderbridge.renderer.Main'
}

dependencies {
    // LWJGL 2 for rendering
    implementation "org.lwjgl.lwjgl:lwjgl:${lwjglVersion}"
    implementation "org.lwjgl.lwjgl:lwjgl_util:${lwjglVersion}"
    
    // Bridge protocol dependency
    implementation project(':bridge-protocol')
    
    // Logging
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "org.slf4j:slf4j-simple:${slf4jVersion}"
    
    // Testing
    testImplementation "junit:junit:${junitVersion}"
    testImplementation "org.hamcrest:hamcrest-core:1.3"
}

test {
    useJUnit()
}

jar {
    archiveBaseName = 'external-renderer'
    archiveClassifier = ''
    archiveVersion = project.version
    
    // Include all dependencies for fat jar
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    
    manifest {
        attributes(
            'Implementation-Title': 'External Renderer',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'GOPROSCOUSIN100',
            'Main-Class': 'renderbridge.renderer.Main',
            'Class-Path': configurations.runtimeClasspath.files.collect { 
                it.getName() 
            }.join(' ')
        )
    }
    
    duplicatesStrategy = 'exclude'
}

// Task for creating a fat jar
task fatJar(type: Jar) {
    archiveBaseName = 'external-renderer-fat'
    archiveClassifier = 'all'
    archiveVersion = project.version
    
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    
    duplicatesStrategy = 'exclude'
    
    manifest {
        attributes(
            'Main-Class': 'renderbridge.renderer.Main'
        )
    }
}

build.dependsOn fatJar
